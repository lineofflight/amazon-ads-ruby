inherit_gem:
  rubocop-shopify: rubocop.yml

plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.3

Naming/AccessorMethodName:
  Exclude:
    - "lib/amazon_ads/apis/**/*.rb"

# Steep's inline RBS mode misattributes methods defined in class << self
Style/ClassMethodsDefinitions:
  EnforcedStyle: def_self
